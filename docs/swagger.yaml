      tags:
      - simple-auto-post
  /simple-auto-post/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a CSV file with topics to add to auto-post queue
      parameters:
      - description: 'CSV file (format: category,topic,tone)'
        in: formData
        name: file
        required: true
        type: file
      - description: Bot User ID (UUID)
        in: formData
        name: botUserId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UploadCSVResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Upload CSV file to import topics
      tags:
      - simple-auto-post
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
