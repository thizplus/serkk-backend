basePath: /api/v1
definitions:
  dto.AutoPostLogListResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/dto.AutoPostLogResponse'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.AutoPostLogResponse:
    properties:
      createdAt:
        type: string
      errorMessage:
        type: string
      generatedTitle:
        type: string
      id:
        type: string
      post:
        $ref: '#/definitions/dto.PostResponse'
      postId:
        type: string
      settingId:
        type: string
      status:
        description: pending, success, failed
        type: string
      tokensUsed:
        type: integer
      topic:
        type: string
      updatedAt:
        type: string
    type: object
  dto.AutoPostSettingResponse:
    properties:
      botUser:
        $ref: '#/definitions/dto.UserResponse'
      botUserId:
        type: string
      createdAt:
        type: string
      cronSchedule:
        type: string
      id:
        type: string
      isEnabled:
        type: boolean
      lastError:
        type: string
      lastGeneratedAt:
        type: string
      maxTokens:
        type: integer
      model:
        type: string
      topics:
        items:
          type: string
        type: array
      totalPostsGenerated:
        type: integer
      updatedAt:
        type: string
    type: object
  dto.CreateAutoPostSettingRequest:
    properties:
      botUserId:
        type: string
      cronSchedule:
        description: Cron expression
        maxLength: 100
        minLength: 9
        type: string
      isEnabled:
        type: boolean
      maxTokens:
        maximum: 4000
        minimum: 100
        type: integer
      model:
        enum:
        - gpt-4
        - gpt-4-turbo
        - gpt-3.5-turbo
        - gpt-4o
        - gpt-4o-mini
        type: string
      topics:
        items:
          type: string
        maxItems: 50
        minItems: 1
        type: array
    required:
    - botUserId
    - cronSchedule
    - topics
    type: object
  dto.CreatePostRequest:
    properties:
      clientPostId:
        description: Client-generated unique ID for idempotency
        maxLength: 255
        minLength: 1
        type: string
      content:
        maxLength: 40000
        minLength: 1
        type: string
      idempotencyKey:
        description: Idempotency key for caching responses
        maxLength: 255
        minLength: 1
        type: string
      isDraft:
        description: true = save as draft (for video encoding)
        type: boolean
      mediaIds:
        description: Max 10 media files per post
        items:
          type: string
        maxItems: 10
        type: array
      sourcePostId:
        description: For crossposting
        type: string
      tags:
        items:
          type: string
        maxItems: 5
        type: array
      title:
        maxLength: 300
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  dto.MediaResponse:
    properties:
      createdAt:
        type: string
      duration:
        description: For videos
        type: number
      fileName:
        type: string
      height:
        type: integer
      id:
        type: string
      mimeType:
        type: string
      size:
        type: integer
      sourceId:
        description: ID of source entity
        type: string
      sourceType:
        description: '"post", "message", "reel", "comment"'
        type: string
      thumbnail:
        type: string
      type:
        description: '"image", "video", "file"'
        type: string
      url:
        type: string
      userId:
        description: Owner of the media
        type: string
      width:
        type: integer
    type: object
  dto.PaginationMeta:
    properties:
      hasMore:
        description: Whether more results exist (for search/filtered lists)
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        description: Exact total count (only if counted from DB)
        type: integer
    type: object
  dto.PostResponse:
    properties:
      author:
        $ref: '#/definitions/dto.UserResponse'
      commentCount:
        type: integer
      content:
        type: string
      createdAt:
        type: string
      hotScore:
        description: For debugging/sorting
        type: number
      id:
        type: string
      isSaved:
        description: true/false
        type: boolean
      media:
        items:
          $ref: '#/definitions/dto.MediaResponse'
        type: array
      sourcePost:
        allOf:
        - $ref: '#/definitions/dto.PostResponse'
        description: For crossposts
      status:
        description: '"draft" or "published"'
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      title:
        type: string
      type:
        description: '"text", "image", "gallery", "video"'
        type: string
      updatedAt:
        type: string
      userVote:
        description: User-specific fields (when authenticated)
        type: string
      votes:
        type: integer
    type: object
  dto.TagResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      postCount:
        type: integer
    type: object
  dto.TriggerAutoPostRequest:
    properties:
      topic:
        description: If empty, randomly select from configured topics
        maxLength: 500
        minLength: 3
        type: string
    type: object
  dto.TriggerAutoPostResponse:
    properties:
      error:
        type: string
      log:
        $ref: '#/definitions/dto.AutoPostLogResponse'
      post:
        $ref: '#/definitions/dto.PostResponse'
      success:
        type: boolean
    type: object
  dto.UpdateAutoPostSettingRequest:
    properties:
      cronSchedule:
        maxLength: 100
        minLength: 9
        type: string
      isEnabled:
        type: boolean
      maxTokens:
        maximum: 4000
        minimum: 100
        type: integer
      model:
        enum:
        - gpt-4
        - gpt-4-turbo
        - gpt-3.5-turbo
        - gpt-4o
        - gpt-4o-mini
        type: string
      topics:
        items:
          type: string
        maxItems: 50
        minItems: 1
        type: array
    type: object
  dto.UpdatePostRequest:
    properties:
      content:
        maxLength: 40000
        minLength: 1
        type: string
      tags:
        items:
          type: string
        maxItems: 5
        type: array
      title:
        maxLength: 300
        minLength: 1
        type: string
    type: object
  dto.UserResponse:
    properties:
      avatar:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      displayName:
        type: string
      email:
        description: Only for owner
        type: string
      followersCount:
        type: integer
      followingCount:
        type: integer
      id:
        type: string
      isActive:
        type: boolean
      isFollowing:
        description: Only when authenticated
        type: boolean
      karma:
        type: integer
      location:
        type: string
      role:
        type: string
      updatedAt:
        type: string
      username:
        type: string
      website:
        type: string
    type: object
  handlers.BatchConfirmResult:
    properties:
      error:
        type: string
      fileKey:
        type: string
      fileUrl:
        type: string
      mediaId:
        type: string
      success:
        type: boolean
    type: object
  handlers.BatchConfirmUploadRequest:
    properties:
      uploads:
        items:
          $ref: '#/definitions/handlers.ConfirmUploadRequest'
        maxItems: 200
        minItems: 1
        type: array
    required:
    - uploads
    type: object
  handlers.BatchConfirmUploadResponse:
    properties:
      failCount:
        type: integer
      failed:
        items:
          $ref: '#/definitions/handlers.BatchConfirmResult'
        type: array
      successCount:
        type: integer
      successful:
        items:
          $ref: '#/definitions/handlers.BatchConfirmResult'
        type: array
      total:
        type: integer
    type: object
  handlers.BatchPresignedUploadRequest:
    properties:
      files:
        items:
          $ref: '#/definitions/handlers.PresignedUploadRequest'
        maxItems: 200
        minItems: 1
        type: array
    required:
    - files
    type: object
  handlers.BatchPresignedUploadResponse:
    properties:
      total:
        type: integer
      uploads:
        items:
          $ref: '#/definitions/handlers.PresignedUploadResponse'
        type: array
    type: object
  handlers.ConfirmUploadRequest:
    properties:
      contentType:
        description: MIME type
        type: string
      duration:
        description: For videos (seconds)
        type: number
      fileKey:
        type: string
      fileSize:
        type: integer
      height:
        description: For images/videos
        type: integer
      mediaId:
        type: string
      sourceId:
        description: ID of the source entity
        type: string
      sourceType:
        description: '"post", "message", "reel", etc.'
        type: string
      thumbnail:
        description: For videos
        type: string
      width:
        description: For images/videos
        type: integer
    required:
    - fileKey
    - fileSize
    - mediaId
    type: object
  handlers.PresignedUploadRequest:
    properties:
      contentType:
        type: string
      fileSize:
        minimum: 1
        type: integer
      filename:
        type: string
      mediaType:
        enum:
        - image
        - video
        - file
        type: string
    required:
    - contentType
    - fileSize
    - filename
    - mediaType
    type: object
  handlers.PresignedUploadResponse:
    properties:
      expiresAt:
        description: When the presigned URL expires
        type: string
      fileKey:
        description: R2 object key
        type: string
      fileUrl:
        description: Final public URL after upload
        type: string
      mediaId:
        description: Media ID for tracking
        type: string
      uploadUrl:
        description: Presigned URL for frontend to upload
        type: string
    type: object
  handlers.UploadCSVResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
      totalFailed:
        type: integer
      totalImported:
        type: integer
    type: object
  health.CheckResult:
    properties:
      duration:
        description: Swagger-compatible annotation
        example: 15ms
        type: string
      error:
        type: string
      message:
        type: string
      status:
        $ref: '#/definitions/health.Status'
      timestamp:
        type: string
    type: object
  health.HealthCheck:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/health.CheckResult'
        type: object
      status:
        $ref: '#/definitions/health.Status'
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.Status:
    enum:
    - healthy
    - unhealthy
    - degraded
    type: string
    x-enum-varnames:
    - StatusHealthy
    - StatusUnhealthy
    - StatusDegraded
  metrics.MetricsSnapshot:
    properties:
      avg_response_time_ms:
        type: number
      custom_counters:
        additionalProperties:
          format: int64
          type: integer
        type: object
      failed_requests:
        type: integer
      max_response_time_ms:
        type: integer
      min_response_time_ms:
        type: integer
      status_2xx:
        type: integer
      status_3xx:
        type: integer
      status_4xx:
        type: integer
      status_5xx:
        type: integer
      successful_requests:
        type: integer
      total_errors:
        type: integer
      total_requests:
        type: integer
      uptime:
        type: string
    type: object
  utils.ErrorDetail:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  utils.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/utils.ErrorDetail'
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:3000
info:
  contact:
    email: support@example.com
    name: API Support
  description: Social media platform backend API with real-time chat, posts, comments,
    and notifications
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: GoFiber Social Media API
  version: "1.0"
paths:
  /api/v1/media/confirm-upload:
    post:
      consumes:
      - application/json
      description: Creates media record after successful frontend upload to R2
      parameters:
      - description: Confirm upload request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ConfirmUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Confirm upload completion
      tags:
      - media
  /api/v1/media/presigned-upload:
    post:
      consumes:
      - application/json
      description: Generates a presigned URL for frontend to upload files directly
        to R2
      parameters:
      - description: Upload request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PresignedUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PresignedUploadResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate presigned upload URL
      tags:
      - media
  /api/v1/media/presigned-upload-batch:
    post:
      consumes:
      - application/json
      description: Generates multiple presigned URLs for frontend to upload files
        directly to R2 (max 200 files)
      parameters:
      - description: Batch upload request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BatchPresignedUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BatchPresignedUploadResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Generate batch presigned upload URLs
      tags:
      - media
  /api/v1/upload/confirm-batch:
    post:
      consumes:
      - application/json
      description: Creates multiple media records after successful frontend uploads
        to R2
      parameters:
      - description: Batch confirm upload request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BatchConfirmUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BatchConfirmUploadResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Batch confirm upload completion
      tags:
      - media
  /auto-post/logs:
    get:
      consumes:
      - application/json
      description: List auto-post generation logs
      parameters:
      - description: Filter by Setting ID
        in: query
        name: settingId
        type: string
      - description: Filter by status (pending, success, failed)
        in: query
        name: status
        type: string
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AutoPostLogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List auto-post logs
      tags:
      - auto-post
  /auto-post/logs/{id}:
    get:
      consumes:
      - application/json
      description: Get auto-post log by ID
      parameters:
      - description: Log ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AutoPostLogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get auto-post log
      tags:
      - auto-post
  /auto-post/settings:
    get:
      consumes:
      - application/json
      description: List all auto-post settings
      parameters:
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: List auto-post settings
      tags:
      - auto-post
    post:
      consumes:
      - application/json
      description: Create a new auto-post setting for AI-powered automatic posting
      parameters:
      - description: Create auto-post setting request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAutoPostSettingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AutoPostSettingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Create auto-post setting
      tags:
      - auto-post
  /auto-post/settings/{id}:
    delete:
      consumes:
      - application/json
      description: Delete auto-post setting by ID
      parameters:
      - description: Setting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Delete auto-post setting
      tags:
      - auto-post
    get:
      consumes:
      - application/json
      description: Get auto-post setting by ID
      parameters:
      - description: Setting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AutoPostSettingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Get auto-post setting
      tags:
      - auto-post
    put:
      consumes:
      - application/json
      description: Update auto-post setting by ID
      parameters:
      - description: Setting ID
        in: path
        name: id
        required: true
        type: string
      - description: Update auto-post setting request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAutoPostSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AutoPostSettingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Update auto-post setting
      tags:
      - auto-post
  /auto-post/settings/{id}/disable:
    post:
      consumes:
      - application/json
      description: Disable auto-post setting by ID
      parameters:
      - description: Setting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Disable auto-post setting
      tags:
      - auto-post
  /auto-post/settings/{id}/enable:
    post:
      consumes:
      - application/json
      description: Enable auto-post setting by ID
      parameters:
      - description: Setting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Enable auto-post setting
      tags:
      - auto-post
  /auto-post/settings/{id}/trigger:
    post:
      consumes:
      - application/json
      description: Manually trigger an auto-post generation for a specific setting
      parameters:
      - description: Setting ID
        in: path
        name: id
        required: true
        type: string
      - description: Trigger auto-post request
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.TriggerAutoPostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TriggerAutoPostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Trigger auto-post manually
      tags:
      - auto-post
  /health:
    get:
      description: Check overall system health
      produces:
      - application/json
      responses:
        "200":
          description: System is healthy
          schema:
            $ref: '#/definitions/health.HealthCheck'
        "503":
          description: System is unhealthy
          schema:
            $ref: '#/definitions/health.HealthCheck'
      summary: Health check
      tags:
      - Health
  /health/live:
    get:
      description: Check if application is alive
      produces:
      - application/json
      responses:
        "200":
          description: Application is alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - Health
  /health/ready:
    get:
      description: Check if application is ready to serve traffic
      produces:
      - application/json
      responses:
        "200":
          description: Application is ready
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Application is not ready
          schema:
            additionalProperties: true
            type: object
      summary: Readiness probe
      tags:
      - Health
  /metrics:
    get:
      description: Get current application metrics including requests, response times,
        and status codes
      produces:
      - application/json
      responses:
        "200":
          description: Current metrics
          schema:
            $ref: '#/definitions/metrics.MetricsSnapshot'
      summary: Get application metrics
      tags:
      - Metrics
  /posts:
    post:
      consumes:
      - application/json
      description: Create a new post with title, content, and media
      parameters:
      - description: Post data
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Post created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation failed
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
